<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Aksara Library">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BA3F5"/>
      <stop offset="100%" stop-color="#9F7AEA"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#68D391"/>
      <stop offset="100%" stop-color="#81E6D9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6BA3F5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>

  <!-- Open book -->
  <g filter="url(#softShadow)">
    <!-- Left cover -->
    <path d="M58 68 C58 58 68 52 78 54 L100 62 L100 148 L78 142 C66 138 58 128 58 118 Z" fill="url(#bookGrad)"/>
    <!-- Right cover -->
    <path d="M142 68 C142 58 132 52 122 54 L100 62 L100 148 L122 142 C134 138 142 128 142 118 Z" fill="url(#bookGrad)" opacity="0.92"/>
    <!-- Pages left -->
    <path d="M72 62 L98 68 L98 140 L74 134 C68 132 64 126 64 118 L64 72 C64 66 68 62 72 62 Z" fill="url(#pageGrad)"/>
    <!-- Pages right -->
    <path d="M128 62 L102 68 L102 140 L126 134 C132 132 136 126 136 118 L136 72 C136 66 132 62 128 62 Z" fill="url(#pageGrad)"/>
    <!-- Spine highlight -->
    <rect x="97" y="62" width="6" height="86" rx="2" fill="#4A8AE8" opacity="0.35"/>
  </g>

  <!-- Letter A on book -->
  <text x="100" y="108" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="36" fill="url(#bookGrad)">A</text>

  <!-- Decorative dots — aksara feel -->
  <circle cx="44" cy="88" r="5" fill="#FC8181" opacity="0.85"/>
  <circle cx="156" cy="88" r="5" fill="#68D391" opacity="0.85"/>
  <circle cx="100" cy="158" r="4" fill="#F6E05E" opacity="0.9"/>

  <!-- Small sparkle -->
  <path d="M168 52 L170 58 L176 60 L170 62 L168 68 L166 62 L160 60 L166 58 Z" fill="#B794F6" opacity="0.7"/>
</svg>
